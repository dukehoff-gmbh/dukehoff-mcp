# Base configuration of all tariffs. A tariff may override any key in tariffs-<tariff>.properties.

# graduated prices per billing unit as from:price,...
# storage per GB stored, traffic per GB, compute per hour, api per thousand calls
price.storage=0:0.80,500:0.65,2000:0.50
price.traffic=0:0.05,1000:0.04,10000:0.03
price.compute=0:0.12,1000:0.10
price.api=0:0.40,100:0.25

rule.base.fee=20.00
rule.volume.threshold=1000
rule.volume.percent=10
rule.loyalty.years=3
rule.loyalty.amount=25.00
rule.student.percent=30
rule.cap.max=25000.00
rule.minimum.amount=15.00
rule.commitment.amount=0
rule.commitment.overage.discount=0

# rules of a tariff as name:priority, applied in ascending priority
tariff.STANDARD.rules=base:1,volume:5,loyalty:7,minimum:90
tariff.STUDENT.rules=base:1,student:4,minimum:90
tariff.BUSINESS.rules=base:1,volume:9,loyalty:12,cap:95
tariff.ENTERPRISE.rules=base:1,commitment:20,cap:95
