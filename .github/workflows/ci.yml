name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # module, launcher, runtime, unit tests; validate checks the license headers
      - name: Build
        run: mvn -B -ntp clean package

      # every tool end to end through the bash launcher on a generated Maven project
      - name: Smoke test
        if: runner.os != 'Windows'
        run: tests/smoke/smoke.sh runtime/target/dukehoffmcp/bin/dukehoff-mcp
        env:
          JDK_HOME: ${{ env.JAVA_HOME }}

      - name: Keep the distribution
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dukehoff-mcp-runtime
          path: |
            runtime/target/dukehoff-mcp-*.tar.gz
            runtime/target/dukehoff-mcp-*.zip
          retention-days: 7
