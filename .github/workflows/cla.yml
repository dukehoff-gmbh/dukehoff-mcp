# Contributor license agreement: on every pull request, checks that all commit authors have signed
# the agreement of Dukehoff GmbH; if not, comments with the link and the sentence that signs it.
# The signatures of all Dukehoff GmbH repositories are kept in one private repository, so one
# signature covers every project.
#
# Inactive until the organization (or repository) variable CLA_DOCUMENT_URL names the published
# agreement. Also needs CLA_SIGNATURES_TOKEN: a fine-grained token that may write the contents of
# dukehoff-gmbh/cla-signatures (and nothing else).
#
# pull_request_target runs with the base branch's workflow and a token that can comment: this workflow
# must never check out or run the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: vars.CLA_DOCUMENT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the signatures
        if: >-
          github.event_name == 'pull_request_target'
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: ${{ vars.CLA_DOCUMENT_URL }}
          remote-organization-name: dukehoff-gmbh
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          branch: main
          allowlist: eppleton,dukehoff,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, every author of its commits signs
            the contributor license agreement of Dukehoff GmbH, once for all its projects. You keep the
            copyright; your contribution always stays available under the Apache License 2.0.
            For work done for an employer, your employer signs the entity version first (see
            CONTRIBUTING.md). To sign as an individual, read the agreement and post the comment below.
