name: Release

# A tag v<version> (e.g. v0.1.0) builds that version, runs the smoke test and publishes a GitHub
# release with the runtime archives, the VS Code extension, the NetBeans plugin, the launcher jar and
# their checksums. Started by hand (Actions > Release > Run
# workflow) it is a dry run: the same build and test, the archives only as a workflow artifact.
# A tag also uploads the NetBeans plugin (and the parent pom) to Maven Central, which the NetBeans Plugin
# Portal takes plugins from, once the secrets CENTRAL_USERNAME and CENTRAL_PASSWORD (a Central Portal
# user token) and MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE (the signing key) are set. The upload
# then waits in the Central Portal for "Publish", unless the repository variable CENTRAL_AUTO_PUBLISH is
# true.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the dry run, e.g. 0.1.0'
        required: true
        default: '0.0.0-dryrun'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH_CENTRAL: ${{ github.ref_type == 'tag' && secrets.CENTRAL_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version=${GITHUB_REF_NAME#v}; else version=${{ inputs.version }}; fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "not a version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # the version in the poms and the extension's package.json comes from the tag; nothing is committed
      - name: Build
        run: |
          mvn -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true
          (cd vscode && npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version)
          mvn -B -ntp clean package

      - name: Smoke test
        run: tests/smoke/smoke.sh runtime/target/dukehoffmcp/bin/dukehoff-mcp
        env:
          JDK_HOME: ${{ env.JAVA_HOME }}

      - name: Checksums
        working-directory: runtime/target
        run: |
          v=${{ steps.version.outputs.version }}
          cp ../../vscode/target/dukehoff-mcp-java-$v.vsix .
          cp ../../server/target/dukehoff-mcp-netbeans-$v.nbm .
          cp ../../launcher/target/dukehoff-mcp.jar dukehoff-mcp-launcher-$v.jar
          sha256sum dukehoff-mcp-$v.tar.gz dukehoff-mcp-$v.zip dukehoff-mcp-java-$v.vsix dukehoff-mcp-netbeans-$v.nbm \
              dukehoff-mcp-launcher-$v.jar > SHA256SUMS

      - name: Publish the release
        if: github.ref_type == 'tag'
        working-directory: runtime/target
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Dukehoff MCP for Java ${VERSION}: unpack the archive (\`.tar.gz\` for macOS and Linux, \`.zip\`
          for Windows), then register it with your agent as described in the
          [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#installation).
          Needs a JDK 17 or newer. For VS Code: install \`dukehoff-mcp-java-${VERSION}.vsix\`
          (Extensions > ... > Install from VSIX), which brings the Apache NetBeans extension along; the tools
          appear in Copilot's agent mode as the server Java. For NetBeans: install
          \`dukehoff-mcp-netbeans-${VERSION}.nbm\` (Tools > Plugins > Downloaded); agents in a terminal reach the
          running IDE with \`java -jar dukehoff-mcp-launcher-${VERSION}.jar --ide\` (see the README).
          \`SHA256SUMS\` has the checksums of all files.
          EOF
          prerelease=; case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "Dukehoff MCP for Java ${VERSION}" \
              --notes-file notes.md --generate-notes $prerelease \
              "dukehoff-mcp-${VERSION}.tar.gz" "dukehoff-mcp-${VERSION}.zip" "dukehoff-mcp-java-${VERSION}.vsix" \
              "dukehoff-mcp-netbeans-${VERSION}.nbm" "dukehoff-mcp-launcher-${VERSION}.jar" SHA256SUMS

      - name: Maven Central credentials and signing key
        if: env.PUBLISH_CENTRAL == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # the poms already carry the tag's version (Build); only the parent and the plugin go to Central
      - name: Publish the NetBeans plugin to Maven Central
        if: env.PUBLISH_CENTRAL == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp -P central -pl server -am deploy -DskipTests \
              -Dcentral.autoPublish=${{ vars.CENTRAL_AUTO_PUBLISH == 'true' }}

      - name: Keep the archives (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dukehoff-mcp-${{ steps.version.outputs.version }}
          path: |
            runtime/target/dukehoff-mcp-${{ steps.version.outputs.version }}.tar.gz
            runtime/target/dukehoff-mcp-${{ steps.version.outputs.version }}.zip
            runtime/target/dukehoff-mcp-java-${{ steps.version.outputs.version }}.vsix
            runtime/target/dukehoff-mcp-netbeans-${{ steps.version.outputs.version }}.nbm
            runtime/target/dukehoff-mcp-launcher-${{ steps.version.outputs.version }}.jar
            runtime/target/SHA256SUMS
          retention-days: 7
